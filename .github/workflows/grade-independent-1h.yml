name: Grade frozen independent 1H forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-evidence
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grade verified pregame receipts against completed ESPN games
        run: python scripts/grade_independent_1h.py
      - name: Publish grade reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calculator/grades
          if ! git diff --cached --quiet; then
            git commit -m 'Grade completed first-half forecasts'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
