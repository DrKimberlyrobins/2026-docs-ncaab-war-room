name: Refresh automatic matchup calculator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/automatic_matchups.py', 'scripts/test_automatic_matchups.py', 'config/kenpom-calculator.json', 'config/kenpom-team-aliases.json', '.github/workflows/kenpom-calculator.yml']
  schedule:
    - cron: '7 */3 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-evidence
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parsing and automatic page
        run: |
          python -m unittest discover -s scripts -p test_automatic_matchups.py
          node --check calculator/calculator.js
          node scripts/test-calculator-flow.cjs
      - name: Fetch public ratings and prepare five daily slates
        id: source
        continue-on-error: true
        run: python scripts/automatic_matchups.py
      - name: Retain results and refresh status
        if: always()
        run: |
          mkdir -p data/calculator
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calculator
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh automatic matchup results and source status'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
            done
          fi
      - name: Report source failure
        if: steps.source.outcome == 'failure'
        run: exit 1
