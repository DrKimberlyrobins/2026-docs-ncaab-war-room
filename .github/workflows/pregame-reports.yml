name: Refresh pregame reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/pregame_reports.py', 'scripts/test_pregame_reports.py', 'config/report-sources.json', 'config/reviewed-reports.json', '.github/workflows/pregame-reports.yml']
  schedule:
    - cron: '22,52 * * * *'
permissions:
  contents: write
concurrency:
  group: pregame-public-reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public reporting evidence
        run: |
          python -m unittest discover -s scripts -p test_pregame_reports.py
          node scripts/test-reports.cjs
      - name: Refresh public feeds
        id: source
        continue-on-error: true
        run: python scripts/pregame_reports.py
      - name: Retain reports and source health
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public team reports and source timestamps'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Report source failure
        if: steps.source.outcome == 'failure'
        run: exit 1
