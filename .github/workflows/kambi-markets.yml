name: Refresh Kambi markets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/kambi_markets.py', 'scripts/test_kambi_markets.py', '.github/workflows/kambi-markets.yml']
  schedule:
    - cron: '3,33 * * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-evidence
  cancel-in-progress: false
jobs:
  markets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify market isolation and parsing
        run: |
          python -m unittest discover -s scripts -p test_kambi_markets.py
          node scripts/test-kambi.cjs
      - name: Collect independent sportsbook snapshots
        id: source
        continue-on-error: true
        run: python scripts/kambi_markets.py
      - name: Retain market results and source status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kambi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh independent Kambi market snapshots'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Report source failure
        if: steps.source.outcome == 'failure'
        run: exit 1
