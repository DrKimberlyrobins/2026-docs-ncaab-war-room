name: Refresh NCAAB evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch timestamped evidence
        id: fetch
        continue-on-error: true
        run: python scripts/refresh.py
      - name: Retain successful snapshots and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh timestamped NCAAB source snapshots'
            git push
          fi
      - name: Report source failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
