name: Refresh NCAAB evidence
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/refresh.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: ncaab-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify daily preparation rules
        run: |
          node --check app.js
          node scripts/check-model.cjs
          python scripts/check-daily.py
          python -m py_compile scripts/stage_torvik_csv.py
          python scripts/test_stage_torvik_csv.py
          python scripts/test_validate_ratings.py
          python scripts/test_audit_team_mapping.py
      - name: Refresh NCAA 365-team membership
        run: python scripts/membership.py
      - name: Fetch timestamped evidence
        id: fetch
        continue-on-error: true
        run: python scripts/refresh.py
      - name: Build ESPN master team lookup
        run: python scripts/build_team_lookup.py
      - name: Cache upcoming matchup evidence
        id: warm
        continue-on-error: true
        run: python scripts/warm.py
      - name: Stage public Torvik CSV for identity review
        continue-on-error: true
        run: python scripts/stage_torvik_csv.py
      - name: Publish verified ratings when reviewed mapping is available
        run: |
          if [ -s data/staging/torvik-ratings.json ] && [ -s data/torvik-espn-reviewed.json ]; then
            python scripts/validate_ratings.py
          else
            echo "No verified mapping or staged CSV; ratings publication blocked."
          fi
      - name: Report live ratings pipeline health
        run: python scripts/ratings_health.py
      - name: Prepare every daily matchup
        run: |
          python scripts/prepare.py
          node scripts/check-prepared.cjs
      - name: Retain successful snapshots and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh timestamped NCAAB source snapshots'
            git push
          fi
      - name: Report source failure
        if: steps.fetch.outcome == 'failure' || steps.warm.outcome == 'failure'
        run: exit 1
