name: Publish War Room
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh automatic matchup calculator', 'Refresh NCAAB evidence']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - style.css
      - calculator/**
      - data/**
      - .github/workflows/publish-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: docs-war-room-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify calculator before publishing
        run: |
          node --check app.js
          node --check calculator/calculator.js
          node --check calculator/import.js
          node scripts/test-ratings-import.cjs
          node scripts/test-calculator-flow.cjs
          python -m unittest discover -s scripts -p test_kenpom_calculator.py
          python -m unittest discover -s scripts -p test_automatic_matchups.py
      - name: Package public site files
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -R calculator data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Inspect and clear the confirmed stale deployment
        uses: actions/github-script@v8
        with:
          script: |
            const site = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            core.info('Pages publishing method: ' + site.data.build_type);
            const records = await github.rest.repos.listDeployments({...context.repo, environment:'github-pages', per_page:10});
            for (const d of records.data) {
              const statuses = await github.rest.repos.listDeploymentStatuses({...context.repo, deployment_id:d.id, per_page:1});
              core.info(JSON.stringify({id:d.id, sha:d.sha, state:statuses.data[0]?.state}));
              if (d.sha === 'f6f5bbb3cbd5bd27d9dfce7aa02c1579e6539810' &&
                  ['queued','pending','in_progress'].includes(statuses.data[0]?.state)) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                    {...context.repo, pages_deployment_id:d.id});
                  core.info('Cleared the confirmed stale deployment ' + d.id);
                } catch(e) {
                  core.warning('Stale deployment cancellation: ' + e.status + ' ' + e.message);
                }
              }
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v5
